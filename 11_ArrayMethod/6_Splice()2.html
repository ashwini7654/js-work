<!DOCTYPE html>
<html lang="en">
<head>
    <title>using Splice() method to remove 1 element</title>
    <script>
           let fruits=["guave","apple","grapes","banana"];
        document.write(`size:${fruits.length}<br>`);
        document.write(`values:${fruits}<br>`);
        let rem=fruits.splice(2,1);
     // let rem=fruits.splice([1,3]);
      document.write(`Remove:${rem}<br>`);
        document.write(`size:${fruits.length}<br>`);
      
        document.write(`values:${fruits}<br>`);

       
    </script>
</head>
<body>
    
</body>
</html>
