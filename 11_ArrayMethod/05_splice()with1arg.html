<!DOCTYPE html>
<html lang="en">
<head>
    <title>Splice() method in array</title>
    <script>
           let fruits=["guave","apple","grapes","banana"];
        document.write(`size:${fruits.length}<br>`);
        document.write(`values:${fruits}<br>`);
        let rem=fruits.splice(2);
     //removes all elements from index 2 to end of array
     //bydefault splice() method removes all elements from the index specified to the end of the array if no second argument is provided
      document.write(`Remove:${rem}<br>`);
        document.write(`size:${fruits.length}<br>`);
      
        document.write(`values:${fruits}<br>`);

       
    </script>
</head>
<body>
    
</body>
</html>
