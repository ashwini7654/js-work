<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Push() method</title>
    <script>
        let fruits=["guave","apple","grapes","banana"];
        document.write(`size:${fruits.length}<br>`);
        document.write(`values:${fruits}<br>`);

        let size=fruits.push("oranges");
        document.write(`size:${size}<br>`);//fruits.length==size
        document.write(`values:${fruits}<br>`);

        size=fruits.push("kiwi","pomengranate","pappaya",12);
        document.write(`size:${size}<br>`);
        document.write(`values:${fruits}<br>`);
        document.write(`size returned by push(): ${size}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
