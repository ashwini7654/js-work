<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let n=Number(prompt("Enter the number"));
        let sumOfEven=0,sumOfOdd=0;
       
        for(let i=1;i<=n;i++)
    {
        i%2===0 ? (sumOfEven=sumOfEven+i):(sumOfOdd=sumOfOdd+i); //turnary operter
      

    }
    document.write (`sum of even nos from 1to${n} is ${sumOfEven}<br>`);
    document.write (`sum of odd nos from 1to${n} is ${sumOfOdd}<br>`);
    </script>
</head>

</body>
</html>
