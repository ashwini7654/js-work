<!DOCTYPE html>
<html lang="en">
<head>
    <title>Decision Control</title>
    <script>
        let ch;
        ch=prompt("enter a character");
     
        ch=ch.toLowerCase();
        switch(ch)
        {
              case "a":case "e":case "i":case "o":case "u":
                document.write(`${ch} is a vowel`);
                break;
                default:ch
                document.write(`${ch} is not a vowel`)
        }
    </script>
</head>
<body>
    
</body>
</html>
