<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ternary Operator</title>
    <script>
        let num=Number(prompt("Enter a number"));
        let msg;
        msg=num==null || isNaN(num)?"Invalid number": num%2==0?"Even":"Odd"    ;
        document.write(`The number ${num} is ${msg}`);
      </script>
</head>

</body>
</html>
