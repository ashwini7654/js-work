<html lang="en">
<head>

    <title>Decsion Control</title>
    <script>
        let n;
        n=Number(prompt("enter a number"));
        document.write(`${ n }`);
        if(n===null || isNaN(n)===true)
    {
        document.write("You didnot inputted  a number");
    }else if(n%2===0){
        document.write(`is an even number`);
    }else{
        document.write(` is an odd number`);
    }
    </script>
</head>
