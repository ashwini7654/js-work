<!DOCTYPE html>
<html lang="en">
<head>
    <title>Concept Of Number</title>
    <script>
        let a=10;//integer is  number for JS
        console.log(a);
        console.log(typeof a);
        document.write(a);
        document.write("<br>")
        document.write(typeof a);
        document.write("<br>");
        a=6.5;//decimal is also number for JS
        console.log(a);
        console.log(typeof a);
        document.write(a);
        document.write("<br>")
        document.write(typeof a);
        document.write("<br>");
        a=0.871578145873;//decimal is also number for JS
        console.log(a);
        console.log(typeof a);
        document.write(a);
        document.write("<br>")
        document.write(typeof a);
        document.write("<br>");
        a=12154127586197762389786785675755558754754376787694875476567453867143 ;//this will give also number but there is problem in output problem is that when our values cross the limit-(2^53-1) to (2^53-1)nthen the representation of the  value changes to exponentiation
        console.log(a);
        console.log(typeof a);
        document.write(a);
        document.write("<br>")
        document.write(typeof a);
        document.write("<br>");
        a=12154127586197762389786785675755558754754376787694875476567453867143n;// to overcome above type problem put n to become new type of datatype in JS whice is BigInt
        console.log(a);
        console.log(typeof a);
        document.write(a);
        document.write("<br>")
        document.write(typeof a);
        document.write("<br>");
           </script>
</head>

</body>
</html>
