<html>
	<head>
		<title>Assignment 2</title>
		<script>
			function addPara() {
				//add new para > where para no should be replaced with para number 3 ,4 ,5 and so on whenever the button is clicked.
				let div=document.querySelector("div");
				let newPara=document.createElement("p");
				let newTextNode=document.createTextNode("I am para  " + (div.children.length+1));
				newPara.appendChild(newTextNode);
				div.appendChild(newPara)
			}
		</script>
	</head>

	<body>
		<div id="d1">
			<p id="p1">I am para 1</p>
			<p id="p2">I am para 2.</p>
		</div>
		<input type="button" value="add new para" onclick="addPara();" />
	</body>
</html>
