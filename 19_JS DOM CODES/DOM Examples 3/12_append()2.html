<html>
	<head>
		<title>Using append() with string</title>
		<script>
			function addPara() {
				let div = document.querySelector("div");
				div.append("Welcome to JavaScript DOM");	 0
			}
		</script>
	</head>

	<body>
		<div id="d1">
			<p id="p1">I am para 1</p>
			<p id="p2">I am para 2.</p>
		</div>
		<input type="button" value="add new para" onclick="addPara();" />
	</body>
</html>
