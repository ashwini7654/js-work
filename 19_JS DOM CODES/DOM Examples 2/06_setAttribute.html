<html>
	<head>
		<title>Sharma Computer Academy</title>
		<script>
			function changeLogo() {
				// Change the image to indiagate.jpg as well as the title
				let newImage=document.querySelector("img");
				newImage.setAttribute("src","../images/bucky.jpg");
				document.title = "Bucky";
				document.querySelector("h3").innerText = "Bucky";
				// let x=newImage.getAttribute("src");
				// console.log(x);
			}
		</script>
	</head>

	<body>
		<h3>Eiffel Tower</h3>
		<img src="../images/eiffel.jpg" /><br />
		<input type="button" value="Change Logo" onclick="changeLogo()" />
	</body>
</html>
