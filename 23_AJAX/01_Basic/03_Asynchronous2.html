<head>
   
    <title>Asynchronous AJAX</title>
    <script>
        const secondfunc=()=>{
            console.log("in second function");
        }
        const firstfunc=()=>{
            console.log("in first function");
            secondfunc();

        };
        firstfunc();


    </script>
</head>
