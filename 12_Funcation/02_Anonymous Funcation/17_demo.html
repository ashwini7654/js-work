<head>

    <title>Anonymous Function</title>
    <script>
     //Anonymous function is a function that does not have any name associated with it. 
    //It is defined without a name and is typically assigned to a variable.
    let a=function()
        {
         let name="Sachin";
         return name; 
        };
        
        document.write(a());//will call the funcation and return the value of name
        document.write("<br>");
        document.write(a);  //will return the code of funcation a
    </script>
</head>

    </script>
