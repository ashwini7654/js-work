<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calling Funcation OnClick</title>
    <script>
        function greetings(name){
            document.write(`Good evening ${name}<br>`);
        }
    </script>
</head>
<body>
    <input type="button" value="click me" onclick="greetings('sachin')">
</body>
</html>
