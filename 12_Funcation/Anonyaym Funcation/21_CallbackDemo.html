<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let id;
 
        function startWatch()
        {
       id=setInterval(function() {
        let today=new Date();
          console.log(today);
        },1000)
        }
        function stopWatch(){
            clearInterval(id);
        }

    </script>
</head>
<body>
    <input type="button" value="start time" onclick="startWatch()"/>
    <input type="button" value="stop time" onclick="stopWatch()"/>
</body>
</html>
