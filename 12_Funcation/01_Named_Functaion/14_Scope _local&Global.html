<!Doctype html>
<html lang="en">
  <head>
    <title>Window Variables</title>
    <script>
      var a = 10;
      let b = 50;
      function f1() {
        let a = 20;
        alert(`Inside F1 a is ${a}`);
        alert(`Inside f1 global a is ${window.a}`);
        alert(`Inside f1 global b is ${b}`);

        a++;
      }
      function f2() {
        var a = 15; // local ,will shadow the global
        alert(`Inside F2 a is ${a}`);
        alert(`Inside f2 global a is ${window.a}`);
        alert(`Inside f2 global b is ${window.b}`);
      }
    </script>
  </head>
  <body>
    <input type="button" value="click F1" onclick="f1()" />
    <input type="button" value="click F2" onclick="f2()" />
  </body>
</html>
