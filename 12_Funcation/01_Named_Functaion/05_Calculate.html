!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calucate</title>
    <script>
        function number(a,b,c)
        {
            let sum=a+b+c;
            document.write(`Given number sum is ${sum}<br>`);
            let avg=sum/3;
            document.write(`And their avg is ${avg.toFixed(2)}<br>`);
        }
        number(1,2,4);
        number(3,45)
        number(3,3,6,8);
    </script>
</head>
