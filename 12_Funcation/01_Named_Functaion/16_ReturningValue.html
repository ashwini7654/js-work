<!DOCTYPE html>
<html lang="en">
<head>

    <title>Returning Value</title>
    <script>
        function add(a,b){
            let c=a+b;
            
            return c;
        }
    </script>
</head>
<body>
    <input type="button" value="click me" onclick="alert(add(10,20))"/>
</body>
</html>
