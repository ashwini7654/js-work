<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calucate</title>
    <script>
         //design a function called calculate which accepts 3 argument and displays sum and avg
        function number(a,b,c)
        {
            let sum=a+b+c;
           return sum;
        }
       
    </script>
</head>
<body>
    <button onclick="document.write(number(1,2,4))">Calculate1</button>
    <button onclick="alert(number(3,3,6))">Calculate2</button>
</body>
</html>
