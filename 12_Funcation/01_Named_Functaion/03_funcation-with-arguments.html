<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions with Arguments</title>
    <script>
        function greetings(name,age)
        {
            document.write(`Good evening ${name} Your age is ${age} <br>`);
        }
        greetings("Sachin",54);
        greetings("Ashwini",34);
        greetings("Raj",45);
        greetings("Ramesh");
        greetings(45);
        greetings();
        
    </script>
</head>
<body>
    
</body>
</html>
