<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funcation</title>
    <script>
        function cal(a,b){
            let c=a+b;
            let d=a-b;
            
            return c;
            return d;
        }
    </script>
</head>
<body>
    <input type="button" value="click me" onclick="alert(cal(10,20))"/>
</body>
</html>
