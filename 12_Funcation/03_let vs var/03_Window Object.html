<!DOCTYPE html>
<html lang="en">
<head>
    <title>Difference in Let & Var with Window Object</title>
    <script>
        var a=10;
        let b=20;
        console.log("value of a is "+a);
        console.log("value of b is "+b);
        console.log("value of a with window object is "+window.a);
        console.log("value of b with window object is "+window.b);
    </script>
</head>
<body>
    
</body>
</html>
