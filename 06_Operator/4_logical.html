<!doctype html>
<html lang="en">
  <head>
    <title>Logical Operators</title>

    <script>
      let a = 10;
      let b = 20;
      let c = 30;

      document.write(`a=10, b=20, c=30<br>`);
      document.write(`a<b && b<c is ${a < b && b < c}<br>`);
      document.write(`a>b && b<c is ${a > b && b < c}<br>`);
      document.write(`a<b || b<c is ${a < b || b < c}<br>`);
      document.write(`a>b || b<c is ${a > b || b < c}<br>`);
      document.write(`!(a<b) is ${!(a < b)}<br>`);
    </script>
  </head>

  <body></body>
</html>
