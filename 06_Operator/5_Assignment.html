<!DOCTYPE html>
<html lang="en">
<head>
    <title> Assignment Operators</title>

    <script>
        let a = 10;
        let b = 20;
        let c = 30;
        document.write(`a=10, b=20, c=30<br>`);
        document.write(`a+=b is ${a+=b}<br>`);  
        document.write(`a-=b is ${a-=b}<br>`);
        document.write(`a*=b is ${a*=b}<br>`);
        document.write(`a/=b is ${a/=b}<br>`);
        document.write(`a%=b is ${a%=b}<br>`);
        document.write(`a**=b is ${a**=b}<br>`);
//a += b  → a = 10 + 20 = 30
// a -= b  → a = 30 - 20 = 10
// a *= b  → a = 10 × 20 = 200
// a /= b  → a = 200 ÷ 20 = 10
// a %= b  → a = 10 % 20 = 10
// a **= b → a = 10 ** 20

    </script>
</head>

<body>
</body>
</html>
