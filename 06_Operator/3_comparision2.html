    <script>
        let a=10;
        let b=10;
        let c="10";
        let d="10.0";
        let x=true;
        let y=1;
        document.write(`a=10 and b=10.0 so a==b is ${a==b}<br>`);
        document.write(`a=10 and b=10.0 so a===b is ${a===b}<br>`);
        document.write(`x=true and y=1 so x==y is ${x==y}<br>`);
        document.write(`x=true and y=1 so x===y is ${x===y}<br>`);
        document.write(`a=10 so ${a!=12} , ${a!=a}<br>`);
        document.write(`a=10 so ${a!==12} , ${a!==10}<br>`);
        document.write(`a=10 ${a>12} , ${a>10} , ${a>=10}<br>`);
        document.write(`a=10 ${a<12} , ${a<10} , ${a<=10}<br>`);

    </script>
