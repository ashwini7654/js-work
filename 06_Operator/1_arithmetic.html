<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Arithmetic Operator Demo</title>
    <script>
        let a=parseInt(prompt("Enter first no"));
        let b=parseInt(prompt("Enter sec no"));
        document.write(`Nos are ${a},${b}<br>`);
        document.write(`Their sum is  ${a+b}<br>`);
        document.write(`Their diff is  ${a-b}<br>`);
        document.write(`Their mult is  ${a*b}<br>`);
        document.write(`Their div is  ${a/b}<br>`);
        document.write(`Their mod is  ${a%b}<br>`);
        document.write(`Their exp is  ${a++}<br>`);
        document.write(`Their exp is  ${a}<br>`);
        document.write(`Their exp is  ${++a}<br>`);
        document.write(`Their exp is  ${a--}<br>`);
        document.write(`Their exp is  ${--a}<br>`);
     

    </script>
    
</head>
<body>
    
</body>
</html>
