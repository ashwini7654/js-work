<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Handling</title>
    <script>
        function show(){
            let myName="Ashwini";
            document.write(`My name is ${myName}`);

        }
    </script>
</head>
<body>
    <button type="button" onclick="show()">name</button>
</body>
</html>
