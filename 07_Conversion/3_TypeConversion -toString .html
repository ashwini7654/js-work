<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion  of toString()</title>
    <script>
          document.write(`<h1>toString() Method</h1><br>`);
          document.write(`(123.45).toString() = ${(123.45).toString()} and its type is ${typeof((123.45).toString())}<br>`);
          document.write(`(true).toString() = ${(true).toString()} and its type is ${typeof((true).toString())}<br>`);
          document.write(`(false).toString() = ${(false).toString()} and its type is ${typeof((false).toString())}<br>`);
           document.write(`(NaN).toString() = ${(NaN).toString()} and its type is ${typeof((NaN).toString())}<br>`);
        //   document.write(`(null).toString() = ${(null).toString()} and its type is ${typeof((null).toString())}<br>`);
        //   document.write(`(undefined).toString() = ${(undefined).toString()} and its type is ${typeof((undefined).toString())}<br>`);
         
        //avove two lines because null and undefined do not have toString() method, so it will give error.
          document.write(`([1,2,3]).toString() = ${([1,2,3]).toString()} and its type is ${typeof(([1,2,3]).toString())}<br>`);

         


    </script>
    </head>

</body>
</html>
