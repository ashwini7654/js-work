<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>TypeCoercion</title>
    <script>
        document.write (`<h1>Type Coercion</h1>`);
        document.write(`10+ 20 = ${10 + 20} and its type is ${typeof(10 + 20)}<br>`);
        document.write(`"1" + 1 = ${"1" + 1} and its type is ${typeof("1" + 1)}<br>`);
        document.write(`"42" - 8 = ${"42" - 8} and its type is ${typeof("42" - 8)}<br>`);
        document.write(`"1" * 1 = ${"1" * 1}    and its type is ${typeof("1" * 1)}<br>`);     
        document.write(`"1" / 1 = ${"1" / 1}    and its type is ${typeof("1" / 1)}<br>`);  
        document.write(`"1" % 1 = ${"1" % 1}    and its type is ${typeof("1" % 1)}<br>`);
        document.write(`true + false = ${true + false} and its type is ${typeof(true + false)}<br>`);   
        document.write(`true - false = ${true - false} and its type is ${typeof(true - false)}<br>`);
        document.write(`true * false = ${true * false} and its type is ${typeof(true * false)}<br>`);   
        document.write(`true + true = ${true + true} and its type is ${typeof(true + true)}<br>`);
        document.write(`true - true = ${true - true} and its type is ${typeof(true - true)}<br>`);
        document.write(`true * true = ${true * true} and its type is ${typeof(true * true)}<br>`);
        document.write(`true / false = ${true / false} and its type is ${typeof(true / false)}<br>`);
        document.write(`true + true + " " = ${true + true + " "} and its type is ${typeof(true + true + " ")}<br>`);
        document.write(`"Good" + " Morning" = ${"Good" + " Morning"} and its type is ${typeof("Good" + " Morning")}<br>`);
        document.write(`"Good" * "morning" = ${"Good " * "Morning"} and its type is ${typeof("Good" * "Morning")}<br>`);
        document.write(`"Bhopal" / 2 = ${"Bhopal" / 2} and its type is ${typeof("Bhopal" / 2)}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
