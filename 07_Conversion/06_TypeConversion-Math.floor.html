<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion of Math.floor()</title>
    <script>
          document.write(`<h1>Math.floor()</h1><br>`);
          document.write(`Math.floor("1") = ${Math.floor("1")} and its type is ${typeof(Math.floor("1"))}<br>`);
            document.write(`Math.floor("0") = ${Math.floor("0")} and its type is ${typeof(Math.floor("0"))}<br>`);
            document.write(`Math.floor(" 1 ") = ${Math.floor(" 1 ")} and its type is ${typeof(Math.floor(" 1 "))}<br>`);
            document.write(`Math.floor("0") = ${Math.floor("0")} and its type is ${typeof(Math.floor("0"))}<br>`);
            document.write(`Math.floor("") = ${Math.floor("")} and its type is ${typeof(Math.floor(""))}<br>`);
            document.write(`Math.floor("1.1") = ${Math.floor("1.1")} and its type is ${typeof(Math.floor("1.1"))}<br>`);
            document.write(`Math.floor("1A2") = ${Math.floor("1A2")} and its type is ${typeof(Math.floor("1A2"))}<br>`);
            document.write(`Math.floor(true) = ${Math.floor(true)} and its type is ${typeof(Math.floor(true))}<br>`);
            document.write(`Math.floor(false) = ${Math.floor(false)} and its type is ${typeof(Math.floor(false))}<br>`);
            document.write(`Math.floor(null) = ${Math.floor(null)} and its type is ${typeof(Math.floor(null))}<br>`);
            document.write(`Math.floor(undefined) = ${Math.floor(undefined)} and its type is ${typeof(Math.floor(undefined))}<br>`);
            document.write(`Math.floor(NaN) = ${Math.floor(NaN)} and its type is ${typeof(Math.floor(NaN))}<br>`);
       


    </script>
    </head>

<body>
    
</body>
</html>
