<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion  of parseInt() & parseFloat()</title>
    <script>
          document.write(`<h1>parseInt() and parseFloat() Functions</h1><br>`);
          document.write(`parseInt("1") = ${parseInt("1")} and its type is ${typeof(parseInt("1"))}<br>`);
            document.write(`parseInt("0") = ${parseInt("0")} and its type is ${typeof(parseInt("0"))}<br>`);
            document.write(`parseInt(" 1 ") = ${parseInt(" 1 ")} and its type is ${typeof(parseInt(" 1 "))}<br>`);
            document.write(`parseInt("0") = ${parseInt("0")} and its type is ${typeof(parseInt("0"))}<br>`);
            document.write(`parseInt("") = ${parseInt("")} and its type is ${typeof(parseInt(""))}<br>`);
            document.write(`parseInt("1.1") = ${parseInt("1.1")} and its type is ${typeof(parseInt("1.1"))}<br>`);
            document.write(`parseInt("1A2") = ${parseInt("1A2")} and its type is ${typeof(parseInt("1A2"))}<br>`);
             document.write(`parseInt("A12") = ${parseInt("A12")} and its type is ${typeof(parseInt("A12"))}<br>`);
            document.write(`parseInt(true) = ${parseInt(true)} and its type is ${typeof(parseInt(true))}<br>`);
            document.write(`parseInt(false) = ${parseInt(false)} and its type is ${typeof(parseInt(false))}<br>`);
            document.write(`parseInt(null) = ${parseInt(null)} and its type is ${typeof(parseInt(null))}<br>`);
            document.write(`parseInt(undefined) = ${parseInt(undefined)} and its type is ${typeof(parseInt(undefined))}<br>`);




            document.write(`parseFloat("1.1") = ${parseFloat("1.1")} and its type is ${typeof(parseFloat("1.1"))}<br>`);
            document.write(`parseFloat("1.1A2") = ${parseFloat("1.1A2")} and its type is ${typeof(parseFloat("1.1A2"))}<br>`);
            document.write(`parseFloat(true) = ${parseFloat(true)} and its type is ${typeof(parseFloat(true))}<br>`);
            document.write(`parseFloat(false) = ${parseFloat(false)} and its type is ${typeof(parseFloat(false))}<br>`);
            document.write(`parseFloat(null) = ${parseFloat(null)} and its type is ${typeof(parseFloat(null))}<br>`);

    </script>
    </head>

<body>
    
</body>
</html>
