<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion  of String()</title>
    <script>
          document.write(`<h1>String() Method</h1><br>`);
          document.write(`String(123) = ${String(123)} and its type is ${typeof(String(123))}<br>`);
          document.write(`String(123.45) = ${String(123.45)} and its type is ${typeof(String(123.45))}<br>`);
         document.write(`String(true) = ${String(true)} and its type is ${typeof(String(true))}<br>`);
         document.write(`String(false) = ${String(false)} and its type is ${typeof(String(false))}<br>`);
         document.write(`String(null) = ${String(null)} and its type is ${typeof(String(null))}<br>`);
         document.write(`String(undefined) = ${String(undefined)} and its type is ${typeof(String(undefined))}<br>`);
         document.write(`String(NaN) = ${String(NaN)} and its type is ${typeof(String(NaN))}<br>`);
         document.write(`String([1,2,3]) = ${String([1,2,3])} and its type is ${typeof(String([1,2,3]))}<br>`);
         


    </script>
    </head>

<body>
    
</body>
</html>
