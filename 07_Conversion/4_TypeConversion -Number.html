<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion  of Number()</title>
    <script>
          document.write(`<h1>Number()Global function</h1><br>`);
          document.write(`Number("1") = ${Number("1")} and its type is ${typeof(Number("1"))}<br>`);
            document.write(`Number("0") = ${Number("0")} and its type is ${typeof(Number("0"))}<br>`);
            document.write(`Number(" 1 ") = ${Number(" 1 ")} and its type is ${typeof(Number(" 1 "))}<br>`);
            document.write(`Number("0") = ${Number("0")} and its type is ${typeof(Number("0"))}<br>`);
            document.write(`Number("") = ${Number("")} and its type is ${typeof(Number(""))}<br>`);
            document.write(`Number("1.1") = ${Number("1.1")} and its type is ${typeof(Number("1.1"))}<br>`);
            document.write(`Number("1A2") = ${Number("1A2")} and its type is ${typeof(Number("1A2"))}<br>`);
            document.write(`Number(true) = ${Number(true)} and its type is ${typeof(Number(true))}<br>`);
            document.write(`Number(false) = ${Number(false)} and its type is ${typeof(Number(false))}<br>`);
            document.write(`Number(null) = ${Number(null)} and its type is ${typeof(Number(null))}<br>`);
            document.write(`Number(undefined) = ${Number(undefined)} and its type is ${typeof(Number(undefined))}<br>`);
            document.write(`Number(NaN) = ${Number(NaN)} and its type is ${typeof(Number(NaN))}<br>`);
       


    </script>
    </head>

<body>
    
</body>
</html>
