<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Type Conversion - Boolean</title>
    <script>
        document.write(`<h1>Boolean()</h1>`);
        document.write(`Boolean("1") = ${Boolean("1")} and its type is ${typeof(Boolean("1"))}<br>`);
        document.write(`Boolean("0") = ${Boolean("0")} and its type is ${typeof(Boolean("0"))}<br>`);
        document.write(`Boolean(" 1 ") = ${Boolean(" 1 ")} and its type ${typeof(Boolean(" 1 "))}<br>`);
        document.write(`Boolean("Bhopal") =${Boolean("Bhopal")} and its type is ${typeof(Boolean("Bhopal"))}<br>`)
       document.write(`Boolean("  ") = ${Boolean("  ")} and its type is ${typeof(Boolean(" "))}<br>`);
        document.write(`Boolean("") = ${Boolean("")} and its type is ${typeof(Boolean(""))}<br>`);
          document.write(`Boolean(null) = ${Boolean(null)} and its type is ${typeof(Boolean(null))}<br>`);
          document.write(`Boolean(undefined) = ${Boolean(undefined)} and its type is ${typeof(Boolean(undefined))}<br>`);

    </script>

</head>
<body>
    
</body>
</html>
