<!DOCTYPE html>
<html>
<head>
    <title>Voting Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .vote-button {
            display: block;
            background-color: #007BFF;
            color: white;
            padding: 15px 25px;
            margin: 20px auto;
            border: none;
            border-radius: 200px;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s, transform 0.2s;
            width: 220px;
        }
        .vote-button:hover{
          background-color: greenyellow ;
          transform: translateY(-8px);
     
        }

        
        .container {
            display: inline-block;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Vote for Your Favorite Party</h1>
    <div class="container">
        <button class="vote-button" onclick="alert('You voted for BJP')">BJP</button>
        <button class="vote-button" onclick="alert('You voted for Congress')">Congress</button>
        <button class="vote-button" onclick="alert('You voted for Samaj Party')">Samaj Party</button>
        <button class="vote-button" onclick="alert('You voted for Aam Party')">Aam Party</button>
    </div>
</body>
</html>
