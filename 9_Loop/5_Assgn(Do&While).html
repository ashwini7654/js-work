<!DOCTYPE html>
<html lang="en">
<head>
    <title>Factorial</title>
    <script>
        let n,Factorial=1;
        n=Number(prompt("Enter the number you want to calc Factorial"));
        do{
            Factorial=Factorial*n;
            n--;
        }
        while(n!==0);
        document.write(`Factorial of given number ${Factorial}`);
            

    </script>
</head>

</html>
