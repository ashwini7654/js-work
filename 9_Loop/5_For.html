<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let n=Number(prompt("enter a number:"));
        document.write(`Table of ${n}<br>`);
        let i=1;
     for(i=1;i<=10;i++)

     {
        if(i==11){
            break;
        }
        document.write(`<tr><td>${n} *${i}=${n * i}</td></tr>`);
     }
        document.write("</table>");
    </script>
</head>

</body>
</html>
