<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept of For</title>
    <script>
    let count=0,n=0,sum=0;

        do{
          n=Number(prompt("Enter the you want:"));
          count++;
          sum=sum+n;
          }
        while(n!=0);
        document.write(`Sum of the nos is ${sum}<br>`);
        document.write(`Avg of the nos is ${sum/(count-1)}<br>`);
 
    </script>
</head>
<body>
    
</body>
</html>
