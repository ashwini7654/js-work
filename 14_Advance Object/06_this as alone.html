<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding this as a standalone keyword</title>
    <script>
        let a=20;
        var x=10;
        // as we know that varible declare with var is global variable and it is attached to window object
        document.write(`${a}<br>`);
        document.write(`${x}<br>`);
        document.write(`${window.x}<br>`);
        document.write(`${this.x}<br>`);
        document.write(`${this===window}<br>`);//same same but different



    </script>
</head>
<body>
    
</body>
</html>
