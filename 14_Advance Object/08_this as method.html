<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding this as a method</title>
    <script>
        let myCar={
            name:"Baleno",
            year:2018,
            color:"Red",
            audioSystem:"Sony",
            showCarDetails:function()
            {
                document.write(`${this.name} : ${this.year} : ${this.color} : ${this.audioSystem}`);
            }
        }
        myCar.showCarDetails();
        
        

    </script>
</head>
<body>
    
</body>
</html>
