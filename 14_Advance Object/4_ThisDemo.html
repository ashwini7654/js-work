<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding this</title>
    <script>
        var x=10;
        document.write(`${x}<br>`);
        document.write(`${window.x}<br>`);
        document.write(`${this.x}<br>`);
        document.write(`${this===window}<br>`);//same same but different



    </script>
</head>

</body>
