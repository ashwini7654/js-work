<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dialog Box Demo</title>
    <script>
      let age;
      age = prompt("What is your age ?");
      age=parseInt(age);// parseInt() is function in JS which can convert string to number
      document.write(`Your age is ${age}<br>`);
      document.write(`After 5 years you will be ${age+5} years old<br>`);
    </script>
  </head>
  <body></body>
</html>
