<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.random()</title>
</head>
<body>
    <script>
        document.write(`Random number between 0 and 1: ${Math.random()}`);
        document.write(`<br>Random number between 0 and 10: ${Math.random().toFixed(1)*10}`);
        let no=Math.random();
        document.write(`<br>Random number : ${no}`);
        document.write(`<br>Random number between 0 and 100: ${no.toFixed(2)*100}`);
    </script>
</body>
</html>
