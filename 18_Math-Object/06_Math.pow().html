<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.pow()</title>
</head>
<body>
    <script>
        document.write(`2 raised to the power of 3 is ${Math.pow(2, 3)}`);
        document.write(`<br>5 raised to the power of 2 is ${Math.pow(5, 2)}`);
        document.write(`<br>10 raised to the power of 0 is ${Math.pow(10, 0)}`);
    </script>
</body>
</html>
