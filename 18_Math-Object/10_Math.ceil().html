<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.ceil()</title>
</head>
<body>
    <script>
        document.write(`ceiling of 4.7 is ${Math.ceil(4.7)}`);
        document.write(`<br>ceiling of 9.2 is ${Math.ceil(9.2)}`);
        document.write(`<br>ceiling of 16.9 is ${Math.ceil(16.9)}`);
    </script>
</body>
</html>
