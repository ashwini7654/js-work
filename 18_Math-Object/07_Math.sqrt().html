<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.sqrt()</title>
</head>
<body>
    <script>
        document.write(`Square root of 4 is ${Math.sqrt(4)}`);
        document.write(`<br>Square root of 9 is ${Math.sqrt(9)}`);
        document.write(`<br>Square root of 16 is ${Math.sqrt(16)}`);
    </script>
</body>
</html>
