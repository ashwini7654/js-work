<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math.floor()</title>
</head>
<body>
    <script>
        document.write(`Floor of 4.7 is ${Math.floor(4.7)}`);
        document.write(`<br>Floor of 9.2 is ${Math.floor(9.2)}`);
        document.write(`<br>Floor of 16.9 is ${Math.floor(16.9)}`);
    </script>
</body>
</html>
