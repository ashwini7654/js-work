<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Representing Random Date and time</title>
    <script>
      function showDate()
      {
        let indep1=new Date(1947,7,15);//0 se jan start hai toh 7 pr aug ayega
        document.write(`${indep1}`);
        let dob=new Date("2002,5,15,15,0,0");
        document.write(`<br>${dob}`);//time show krme ka alag tarika
        
        

        }
    </script>

    
</head>
<body>
    <button type="button" onclick="showDate()">Show Independent Date</button>
</body>
</html>
