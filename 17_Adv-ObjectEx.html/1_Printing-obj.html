<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printing Object</title>
    <script>
      let person={
        name:"Ashwini",
        age:20,
        toString:function()
        {
            return`name:${person.name},age:${person.age}`;
        }
      }  
    </script>
</head>
<body>
    
</body>
</html>
