<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String creation</title>
    <script>
      let str1="Ashwini";
      //string literal, this is a value type 
      document.write(`Type of str1 is ${typeof str1}<br>`);

      let str2=new String("Ashwini");
      //string object, this is a reference type str2 is reference to the object created in heap memory
      document.write(`Type of str1 is ${typeof str1}<br>`);

    </script>
</head>

</body>

</html>
