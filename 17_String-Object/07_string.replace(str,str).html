   >
    <title>string replace()</title>
    <script>
        let str="Welcome , user";
        let newStr=str.replace("user","Ashwini");
        document.write(`<br>Original string: ${str}<br>`);
        document.write(`New string: ${newStr}<br>`);
        let newstr1=str.replace(",","->");
        document.write(`New string: ${newstr1}<br>`);
    </script>
</head>
