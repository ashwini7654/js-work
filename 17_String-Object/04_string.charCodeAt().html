<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String charCodeAt</title>
    <script>
       let city="Bhopal";
       document.write(`Character code of character at index 0 of string(${city}) is ${city.charCodeAt(0)}<br>`);
       document.write(`Character code of character at index 3 of string(${city}) is ${city.charCodeAt(3)}<br>`);
       document.write(`A ascii code is ${"A".charCodeAt(0)}<br>`);
       document.write(`a ascii code is ${"AaBb".charCodeAt(1)}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
