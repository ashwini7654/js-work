    <title>String Handling-substring</title>
    <script>
       let str="Programming";
         document.write(`Substring of string(${str}) from index 0 to 4 is ${str.substring(0,4)}<br>`);
            document.write(`Substring of string(${str}) from index 3 to 7 is ${str.substring(3,7)}<br>`);
            document.write(`Substring of string(${str}) from index 5 to 15 is ${str.substring(5,15)}<br>`);
            alert(`Substring of string(${str}) from index 0 to 4 is ${str.substring(0,4)}`);
    </script>
