<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Assignment 1</title>
    <script>
        let str=prompt("Enter string value");
        document.write(`Length of string(${str}) is ${str.length}<br>`);
        document.write(`{str} 's first character is ${str.charAt(0)}<br>`);
        document.write(`{str} 's last character is ${str.charAt(str.length - 1)}<br>`);
        document.write(`{str} 's uppercase is ${str.toUpperCase()}<br>`);
        document.write(`{str} 's lowercase is ${str.toLowerCase()}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
