<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String lastIndexOf</title>
    <script>
       let str1="Welcome to Bhopal";
       document.write(`Index of character 'A' in string(${str1}) is ${str1.lastIndexOf('A')}<br>`);
         document.write(`Index of character 'h' in string(${str1}) is ${str1.lastIndexOf('h')}<br>`);
         document.write(`Index of character 'e' in string(${str1}) is ${str1.lastIndexOf('e')}<br>`);
    </script>
</head>
<body>
  
</body>
</html>
