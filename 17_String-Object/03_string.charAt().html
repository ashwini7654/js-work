<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String charAt</title>
    <script>
      let str1="Ashwini";
      document.write(`Character at index 0 of string(${str1}) is ${str1.charAt(0)}<br>`);
      document.write(`Character at index 3 of string(${str1}) is ${str1.charAt(3)}<br>`);
      document.write(`Character at index 6 of string(${str1}) is ${str1.charAt(6)}<br>`);
      document.write(`Character at index 10 of string(${str1}) is ${str1.charAt(10)}<br>`);
      //if index is greater than length of string then it will return empty string
    </script>
</head>
<body>
 
</body>
</html>
