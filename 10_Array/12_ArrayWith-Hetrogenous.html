<!DOCTYPE html>
<html lang="en">
<head>

    <title>Array with Heterogeneous Elements</title>
    <script>
        let arr = [10, "Hello", true, null, undefined, {name: "John"}, [1, 2, 3]];
        document.write(`Array Elements:<br>`);
        for(let i=0; i<arr.length; i++)
        {
            document.write(`arr[${i}]: ${arr[i]}<br>`);
        }
        document.write(`Size of Array is ${arr.length}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
