
<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Array with undefined</title>
    <script>
      
      let colors =["red","green","blue"];
      document.write(`colors[0]: ${colors[0]}<br>`);
      document.write(`colors[1]: ${colors[1]}<br>`);
      document.write(`colors[2]: ${colors[2]}<br>`);
      document.write(`colors[3]: ${colors[3]}<br>`); // This will output undefined
      document.write(`Size of Array is ${colors.length}<br>`);
      colors[10] = "yellow"; // Adding a new element at index 10
      document.write(`${colors}<br>`);
      document.write(`Size of Array is ${colors.length}<br>`);
    </script>
</head>
<body>
    
</body>
</html>
