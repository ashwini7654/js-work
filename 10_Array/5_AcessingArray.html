
<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Acessing element of array using for loop</title>
    <script>
        let evens=[];
        document.write(`current size of array is ${evens.length}<br>`);//length is property in array

        evens[0]=2;
        evens[1]=4;
        evens[5]=6;
        evens[3]=8;
        evens[10]=10;
        document.write(`${evens}<br><br><br>`);
        
        for(let i=0; i<evens.length;i++)
    {
        document.write(`${evens[i]}<br>`);
    }

    </script>
</head>
<body>
    
</body>
</html>
