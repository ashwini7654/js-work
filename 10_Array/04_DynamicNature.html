
<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Acessing element of array</title>
    <script>
        let evens=[];
        document.write(`current size of array is ${evens.length}<br>`);//length is property in array

        evens[0]=2;
        evens[1]=4;
        evens[5]=6;
        evens[3]=8;
        evens[10]=10;
        document.write(`${evens}<br>`);
        document.write(`After adding 5 elements  size of array is ${evens.length}<br>`);//length is property in array
       document.write(`element at 0th position is ${evens[0]}<br>`);
       document.write(`element at 1st position is ${evens[1]}<br>`);
       document.write(`element at 2nd position is ${evens[2]}<br>`);
       document.write(`element at 3rd position is ${evens[3]}<br>`);
       document.write(`element at 4th position is ${evens[4]}<br>`);
       document.write(`element at 5th position is ${evens[5]}<br>`);

    </script>
</head>
<body>
    
</body>
</html>
