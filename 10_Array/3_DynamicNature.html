
<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Dynamic nature of array</title>
    <script>
        let evens=[];
        document.write(`current size of array is ${evens.length}<br>`);//length is property in array

        evens[0]=2;
        evens[1]=4;
        evens[5]=6;
        evens[3]=8;
        evens[10]=10;
        document.write(`${evens}<br>`);
        document.write(`After adding 5 elements  size of array is ${evens.length}<br>`);//length is property in array
     

    </script>
</head>
<body>
    
</body>
</html>
