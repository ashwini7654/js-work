<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Square with Arrow Function</title>
    <script>
        let square= n=> n*n;
        // let square= n=> {n*n}; worung because we have to use return keyword when we use {}.
        // let square= n=> return n*n; worung because we have to use {} when we use return keyword.
        document.write(`Square of 10:${square(10)}`);
    </script>
</head>

</html>
