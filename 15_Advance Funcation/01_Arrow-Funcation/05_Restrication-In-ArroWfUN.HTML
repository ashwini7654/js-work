<!DOCTYPE html>
<html lang="en">
<head>
    <title>Restriction in Arrow Function</title>
    <script>
        //01 Arrow function cannot  have this keyword as it is not bound to any object
        let obj={
            name:"Rohit",
            age:22,
            // toString:()=>{
            //     return `Name:${this.name} Age:${this.age}`;
            // }

            //02 Arrow function cannot be used as a method of an object
             toString:()=>{
                return `Name:${obj.name} Age:${obj.age}`;
            }
        } 
        document.write(obj);
        //02 Arrow function do not have arguments object
        let sum=(a,b)=>{
            document.write(`Arguments are ${arguments}<br>`);
            return a+b;
        }
        document.write(`Sum is ${sum(10,20)}`);
    </script>
</head>
<body>
    
</body>
</html>
