<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using For Each </title>
    <script>
          document.write(`<h1>Old way to iterate in  arrays</h1><br>`);
        function show(x){
           
           document.write(`${x}<br>`);
            
        }
        let arr=[10,20,30,40,50];
        for(let b of arr)
        {
            show(b);
        }
        document.write(`<h1>New way to iterate in  arrays using forEach</h1><br>`);
        // Above new type Javescript
        let arr1=[100,200,300,400,500];
        arr1.forEach( function (x){
            document.write(`${x}<br>`);
        }
        );
        
       
        
       
    </script>
</head>
<body>
    
</body>
</html>
