<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping over Object through the for...in loop</title>
<script>
    let myCar=new Object();
    myCar.name="Baleno"
    myCar.year=2018;
    myCar.color="Red";
  myCar.audioSystem="Sony"
for(let key in myCar)
{
    document.write(`${key} : ${myCar[key]}<br>`);
    // document.write(`${key} : ${myCar.key}<br>`);
   // will give undefined because key is a variable and not a property of myCar object
    
}

</script>
</head>
<body>
    
</body>
</html>
