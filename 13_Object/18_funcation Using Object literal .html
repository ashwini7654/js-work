<!doctype html>
<html lang="en">
  <head>
    <title>Creating Object using Literal</title>
    <script>
      let myCar = {
        name: "Baleno",
        year: 2018,
        color: "Red",
        audioSystem: "Sony",
        showDetails: function () {
          document.write(
            `Car name is ${myCar.name} <br> Car year is ${myCar.year} <br> Car color is ${myCar.color}<br> and audio system is ${myCar.audioSystem}`,
          );
        },
      };
        myCar.showDetails();
    </script>
  </head>
  <body></body>
</html>
