<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping over Object the for...of loop</title>
<script>
    let myCar=new Object();
    myCar.name="Baleno"
    myCar.year=2018;
    myCar.color="Red";
  myCar.audioSystem="Sony"
  let arr=Object.entries(myCar);
for(let key of arr)
{
    document.write(`${key[0]} : ${key[1]} <br>`);
    
}

</script>
</head>
<body>
    
</body>
</html>
