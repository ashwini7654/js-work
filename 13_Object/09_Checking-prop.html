<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Checking property</title>
<script>
    let myCar=new Object();
    myCar.name="Baleno"
    myCar.year=2018;
    myCar.audio="Sony";
    document.write("Checking property audio in myCar object");
    document.write("<br>"); 
    document.write("audio" in myCar);
    document.write("<br>");
    
delete myCar.audio;
document.write("After deleting audio property");
document.write("<br>");
document.write("audio" in myCar);
document.write("<br>");


</script>
</head>
