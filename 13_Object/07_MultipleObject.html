<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding multiple objects</title>
<script>
    let myCar1=new Object();
    myCar1.name="Baleno"
    myCar1.year=2018;
    myCar1.color="Red";
document.write("Details of myCar1");
document.write("<br>");
document.write("Name: "+myCar1.name);
document.write("<br>");
document.write("Year: "+myCar1.year);
document.write("<br>");
document.write("Color: "+myCar1.color);
document.write("<br>");
    let myCar2=new Object();
    myCar2.name="i10";
    myCar2.year=2022;
    myCar2.color="Blue";
    myCar2.audioSystem="kenwood";
document.write("<br>");
document.write("Details of myCar2");
document.write("<br>");
document.write("Name: "+myCar2.name);
document.write("<br>");
document.write("Year: "+myCar2.year);
document.write("<br>");
document.write("Color: "+myCar2.color);
document.write("<br>");
document.write("Audio System: "+myCar2.audioSystem);
document.write("<br>");
    console.log(myCar1);
    console.log(myCar2);

   

</script>
</head>

</body>
</html>
