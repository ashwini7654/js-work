<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Assignment1</title>
  <script>
        function check(){
            let ans=prompt("Enter google or facebook to visit");
            if(ans=="google"){
                window.location.href="https://www.google.com/";
            }
            else if(ans=="facebook"){
                window.location.href="https://www.facebook.com/";
            }
            else{
                alert("Invalid input");
            }
           
        }
    </script>
</head>
<body>
     
    <input type="button" value="Click me" onclick="check()">
</body>
</html>
