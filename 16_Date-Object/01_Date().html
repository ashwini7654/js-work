<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date in JS</title>
    <script>
      function showDate(){
        let now=new Date;
        document.write(`${now}`);
        

        }
    </script>

    
</head>
<body>
    <button type="button" onclick="showDate()">ShowCurrent Date</button>
</body>
</html>
