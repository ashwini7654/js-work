<!DOCTYPE html>
<html lang="en">
<head>

    <title>Assignment 3</title>
    <script>
        let numbers =[];
        let number=prompt("Enter the number of  numbers you want to add in array:");
        for(let i=0; i<number; i++){
            let num=prompt(`Enter number ${i+1}:`);
            numbers.push(num);
        }
        document.write(`WE have the following numbers in the array:${numbers}<br>`);
    for(let i=0;i<numbers.length;i++){
        for(let j=i+1;j<numbers.length;j++){
            if(numbers[i]==numbers[j]){
                numbers.splice(j, 1);
                j--;
            }
        }
    }
      document.write(`After removing duplicates from array:<br>`);
        document.write(`left numbers:${numbers}<br>`);  
    </script>
</head>

</body>
</html>
