<!DOCTYPE html>
<html lang="en">
<head>

    <title>Assignment 2</title>
    <script>
        let numbers =[];
        let number=prompt("Enter the number of  numbers you want to add in array:");
        for(let i=0; i<number; i++){
            let num=prompt(`Enter number ${i+1}:`);
            numbers.push(num);
        }
        document.write(`WE have the following numbers in the array:${numbers}<br>`);
        let serchNum=prompt("Enter the number you want to remove:");
        let index=numbers.indexOf(serchNum);
        while(index!=-1){
            numbers.splice(index, 1);
           index=numbers.indexOf(serchNum, index+1);
        }
        document.write(`After removing ${serchNum} from array:<br>`);
        document.write(`left numbers:${numbers}<br>`);
      
        
    </script>
</head>
<body>
    
</body>
</html>
