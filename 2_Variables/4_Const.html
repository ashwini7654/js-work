<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept of const </title>
    <script>
 let a=10;
 document.write(a);
 document.write("<br>");
 a=12;
 document.write(a);
 document.write("<br>");
 const b=12.23;
 document.write(b);
 document.write("<br>");
 b=11;
 console.log(b)
 document.write(b); //this will not print because of this is error checking from console.log
 document.write("<br>");
    </script>
</head>

</body>
